appId: dev.proharness.app
productName: ProHarness
copyright: Copyright © 2026 ProHarness

directories:
  buildResources: build
  output: release

files:
  - out/**/*
  - package.json
  - "!**/*.map"
  - "!**/*.ts"
  - "!**/node_modules/.cache/**"
  - "!node_modules/@homebridge/node-pty-prebuilt-multiarch/prebuilds/{linux,win32,darwin-x64}*/**"

asar: true
asarUnpack:
  - node_modules/@homebridge/node-pty-prebuilt-multiarch/**/*

npmRebuild: false
compression: normal
removePackageScripts: true

mac:
  target:
    - target: dmg
      arch: [arm64]
    - target: zip
      arch: [arm64]
  category: public.app-category.developer-tools
  icon: build/icon.png
  darkModeSupport: true
  hardenedRuntime: true
  gatekeeperAssess: false
  # Ad-hoc signed.
  # Remove the identity setting and set CSC_LINK and CSC_KEY_PASSWORD to sign with a Developer ID.
  identity: "-"
  minimumSystemVersion: "13.0"
  artifactName: ProHarness-${version}-${arch}-mac.${ext}
  extendInfo:
    NSHumanReadableCopyright: Copyright © 2026 ProHarness

dmg:
  artifactName: ProHarness-${version}-${arch}.${ext}
  title: ProHarness ${version}

publish: null

electronDownload:
  cache: .cache/electron
